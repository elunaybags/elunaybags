<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElunayBags — Revista</title>
<meta name="description" content="ElunayBags · Bolsos de autor tejidos a mano. Piezas únicas y encargos a tu gusto.">
<meta name="theme-color" content="#0E0C0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elunay">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: maison de lujo, editorial, sereno
   IDEA: una revista impresa cuyas páginas giran sobre el lomo
   PICTURE: los bolsos recortados sobre papel crema y champán
   COLOUR: tinta #0E0C0A, papel #F3EDE4, oro #D4B47C
   TYPE: Bodoni Moda + Jost; LAYOUT: dobles páginas a pantalla completa */
:root{--ink:#0E0C0A;--paper:#F3EDE4;--gold:#D4B47C;--bronze:#8A6A3E;--muted:#5A5148;--vh:100vh}
@supports (height:100dvh){:root{--vh:100dvh}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--ink);color:var(--ink);font:300 16px/1.6 Jost,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.serif{font-family:'Bodoni Moda',Georgia,serif;font-weight:400}
.kick{font-size:11px;letter-spacing:.32em;text-transform:uppercase}
.gold{color:var(--gold)}.bronze{color:var(--bronze)}
.view[hidden]{display:none!important}

/* ===== Revista ===== */
#mag{position:relative}
.stage{position:relative;height:var(--vh);overflow:hidden;perspective:2600px;perspective-origin:0 50%;touch-action:pan-y}
body.mag-on{overflow:hidden}
.pg{transition:transform .95s cubic-bezier(.55,.06,.3,1),box-shadow .95s,visibility 0s linear 0s;overflow-y:auto;overscroll-behavior:contain}
.pg.turned{transform:rotateY(-100deg);visibility:hidden;box-shadow:none;transition:transform .95s cubic-bezier(.55,.06,.3,1),box-shadow .95s,visibility 0s linear .95s}
.pg.turning{box-shadow:30px 0 70px rgba(0,0,0,.5)}
.pg .shade{opacity:0;transition:opacity .95s;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.18) 60%,rgba(0,0,0,.55))}
.pg.turned .shade{opacity:1}
.nav-arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:42;width:40px;height:40px;border-radius:20px;border:0;background:transparent;color:var(--paper);mix-blend-mode:difference;opacity:.6;font-size:26px;font-family:'Bodoni Moda',serif;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.nav-arrow[disabled]{opacity:0;pointer-events:none}
@media(max-width:820px){.nav-arrow{display:none}}
.nav-arrow:hover{opacity:1}
.pg{position:absolute;inset:0;transform-origin:0 50%;backface-visibility:hidden;will-change:transform;background:var(--paper)}
.shade{position:absolute;inset:0;pointer-events:none;z-index:5}
.spread{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));height:100%}
.half{position:relative;height:100%;overflow:hidden}
.txt{padding:7vh 5vw;display:flex;flex-direction:column;gap:2.4vh;overflow:auto}
.dark{background:var(--ink);color:var(--paper)}
.stage-bg{background:radial-gradient(ellipse at 50% 42%,#FBF7F1 0%,#EFE6DA 70%,#E3D6C5 100%)}
.stage-bg.warm{background:radial-gradient(ellipse at 50% 42%,#F6EEE2 0%,#E4D6C1 60%,#CDB99C 100%)}
.prod{width:100%;height:100%;object-fit:contain;padding:6vh 3vw;filter:drop-shadow(0 22px 26px rgba(14,12,10,.22));transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.half:hover .prod{transform:scale(1.03)}
.h1{font-size:min(5.4vw,8.4vh);line-height:.96;margin:0}
.lead{font-size:min(1.25vw,1.95vh);line-height:1.85;margin:0}
.folio{margin-top:auto;align-self:flex-end;font-size:12px;letter-spacing:.2em}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:1px solid currentColor;background:transparent;font-size:11px;letter-spacing:.22em;text-transform:uppercase;transition:background .3s,color .3s}
.btn.solid{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:500}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn:hover{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.icon-btn{width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;border:1px solid currentColor;background:transparent}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
dl.spec{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6vh 2vw;padding-top:2vh;border-top:1px solid currentColor}
dl.spec dt{font-size:10px;letter-spacing:.3em;text-transform:uppercase;opacity:.8}
dl.spec dd{margin:4px 0 0;font-size:14px}
.cat{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2.4vh 1.4vw;align-content:start;overflow:auto}
.cat button{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:0;border:0;background:transparent;text-align:left}
.cat .ph{display:block;width:100%;aspect-ratio:1/1}
.cat img{width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 14px 16px rgba(14,12,10,.18));transition:transform .8s}
.cat button:hover img{transform:scale(1.05)}
.cat .nm{font-family:'Bodoni Moda',serif;font-size:min(1.3vw,2vh);line-height:1.25;min-height:2.5em;display:block}
.cat .pr{font-size:12px;color:var(--muted)}
.dots{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:8px;padding:4px 8px;color:rgba(243,237,228,.85);mix-blend-mode:difference;pointer-events:none}
.dots>*{pointer-events:auto}
.dots button{width:4px;height:24px;border:0;padding:0;background:linear-gradient(rgba(243,237,228,.45),rgba(243,237,228,.45)) center/100% 1px no-repeat;transition:width .3s}
.dots button.on{width:14px;background:linear-gradient(#F3EDE4,#F3EDE4) center/100% 1px no-repeat}
.hint{animation:hint 2.2s ease-in-out infinite}
@keyframes hint{50%{transform:translateY(8px);opacity:1}}
.swatch{width:44px;height:44px;border-radius:50%;border:1px solid rgba(14,12,10,.25);padding:0}
.swatch.on{box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--ink)}
.pill{min-height:44px;padding:0 18px;border:1px solid currentColor;background:transparent;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.badge[hidden]{display:none}
.enc .pill.on,.dark .pill.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}

/* bolso de vista previa */
.opts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:560px}
.orow{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:10px}
.orow .lbl{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.enc .orow .lbl,.dark .orow .lbl{color:#A89E92}
.ops{display:flex;flex-wrap:wrap;gap:6px}
.op{min-height:34px;padding:0 12px;border:1px solid rgba(14,12,10,.35);background:transparent;font-size:10px;letter-spacing:.14em;text-transform:uppercase;transition:all .25s}
.op.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.enc .op{border-color:rgba(212,180,124,.4);color:var(--paper)}
.enc .op.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid rgba(14,12,10,.25);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink)}
.enc .sw{border-color:rgba(243,237,228,.3)}.enc .sw.on{box-shadow:0 0 0 2px var(--ink),0 0 0 3px var(--gold)}
@media(max-width:600px){.orow{grid-template-columns:minmax(0,1fr);gap:6px}}
.mockwrap svg{max-width:92%;max-height:80%;height:auto}
#mgMock{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:radial-gradient(circle at 50% 55%,rgba(243,237,228,.14),transparent 60%)}
#mgMock svg{max-width:88%;max-height:86%;height:auto}
.aside svg{max-width:100%;height:auto}
.mock{position:relative;display:flex;flex-direction:column;align-items:center}
.mock .hd,.mock .bag{transition:all .5s ease}
.mock .bag{border-radius:16px 16px 24px 24px;box-shadow:0 26px 50px rgba(0,0,0,.45),inset 0 -16px 26px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.mock .plate{color:var(--ink);font:italic 13px 'Bodoni Moda',serif;padding:5px 16px;border-radius:12px}

/* ===== Barra fija ===== */
.topbar{position:fixed;top:14px;right:16px;z-index:45;display:flex;gap:8px}
.topbar button,.topbar a{position:relative;width:48px;height:48px;border-radius:24px;border:1px solid rgba(212,180,124,.6);background:rgba(14,12,10,.78);color:var(--paper);display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center}

/* ===== Páginas normales (ficha y encargo) ===== */
.page{min-height:100vh;background:var(--paper)}
.bar{background:var(--ink);color:var(--paper)}
.bar .in{max-width:1360px;margin:0 auto;padding:16px 76px 16px max(5vw,16px);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font:700 28px 'Bodoni Moda',serif;letter-spacing:.1em}
.wrap{max-width:1360px;margin:0 auto;padding:28px max(5vw,16px) 96px}
.pd{display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start}
.gal{flex:999 1 520px;display:flex;gap:14px;flex-wrap:wrap-reverse}
.thumbs{display:flex;flex-direction:column;gap:10px;flex:0 0 80px}
.thumbs button{width:80px;height:100px;padding:4px;border:0;background:#EBE3D8;outline:1px solid transparent;outline-offset:2px}
.thumbs button.on{outline-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:contain}
.main{flex:1 1 380px;position:relative;height:min(720px,70vh);overflow:hidden;display:flex;align-items:center;justify-content:center}
.main img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;transition:transform .6s cubic-bezier(.2,.7,.2,1);filter:drop-shadow(0 22px 26px rgba(14,12,10,.2))}
.main img.z{transform:scale(1.8);cursor:zoom-out}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:24px;border:0;background:rgba(243,237,228,.92);font-size:20px}
.info{flex:1 1 360px;display:flex;flex-direction:column;gap:20px}
@media(min-width:900px){.info{position:sticky;top:24px}}
.acc button{width:100%;min-height:56px;display:flex;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid #D9CFC3;background:transparent;font:20px 'Bodoni Moda',serif;text-align:left;padding:0}
.acc p{margin:12px 0 18px;white-space:pre-line;color:#3A342E;font-size:15px}
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px 0;border-block:1px solid #D9CFC3;font-size:12px;text-align:center}
.rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:24px}
.rel a{display:flex;flex-direction:column;gap:10px}
.rel .ph{display:block;aspect-ratio:1/1}.rel img{width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 14px 16px rgba(14,12,10,.18))}
.enc{background:var(--ink);color:var(--paper)}
.enc .wrap{display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.steps button{width:100%;min-height:56px;border:0;border-top:2px solid rgba(243,237,228,.2);background:transparent;text-align:left;padding:10px 0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;display:flex;flex-direction:column;gap:4px}
.steps button.done{border-top-color:var(--gold)}.steps button.cur{color:var(--gold)}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.models button{padding:0;border:1px solid rgba(212,180,124,.25);background:#171411;text-align:left}
.models button.on{border-color:var(--gold);outline:1px solid var(--gold)}
.models .ph{display:block;aspect-ratio:1/1;background:var(--paper);padding:8px}.models img{width:100%;height:100%;object-fit:contain}
.models span{display:block;padding:8px;font-family:'Bodoni Moda',serif;min-height:3.2em}
.field{display:flex;flex-direction:column;gap:8px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#A89E92}
.field input,.field textarea{font:16px Jost,sans-serif;letter-spacing:0;text-transform:none;color:var(--paper);background:transparent;border:1px solid rgba(212,180,124,.5);padding:14px}
.aside{flex:1 1 340px;background:#171411;border:1px solid rgba(212,180,124,.3);padding:32px;display:flex;flex-direction:column;align-items:center;gap:24px}
@media(min-width:900px){.aside{position:sticky;top:24px}}
.aside dl{margin:0;width:100%;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.aside dt{color:#A89E92}.aside dd{margin:0;text-align:right}

/* ===== Capas ===== */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(8,7,6,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.overlay[hidden]{display:none}
.dialog{position:relative;width:100%;max-width:940px;max-height:90vh;overflow:auto;background:var(--paper);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.dialog .ph{min-height:380px;padding:24px;display:flex;align-items:center;justify-content:center}
.dialog .ph img{width:100%;max-height:64vh;object-fit:contain;filter:drop-shadow(0 22px 26px rgba(14,12,10,.2))}
.x{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;background:transparent;font-size:28px}
.drawer{position:fixed;inset:0;z-index:65;display:flex;justify-content:flex-end}
.drawer[hidden]{display:none}
.drawer .bg{flex:1;border:0;background:rgba(8,7,6,.6)}
.drawer aside{width:420px;max-width:92vw;height:100%;background:var(--paper);display:flex;flex-direction:column}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);border:1px solid var(--gold);padding:14px 22px;font-size:13px;letter-spacing:.08em;max-width:90vw}
.toast[hidden]{display:none}

/* ===== Móvil ===== */
@media(max-width:820px){
 .spread{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;height:auto;min-height:100%}
 .half{height:auto;min-height:46vh}
 .spread>.half:not(.txt){order:-1;height:46vh;min-height:0;display:flex;align-items:center;justify-content:center}
 .spread>.half:not(.txt) .prod{height:100%!important;padding:3vh 8vw 2vh}
 .spread>.half:not(.txt) .quote{display:none}
 .spread>.half.stick{position:sticky;top:0;z-index:6;height:40vh;box-shadow:0 10px 24px rgba(0,0,0,.25)}
 .spread>.half.stick .folio{display:none}
 .spread>.half.stick svg{max-height:92%}
 .spread>.half:not(.txt)>img:not(.prod){height:100%}
 .half.txt{min-height:0;overflow:visible;padding-bottom:96px}
 .pg>div[style*="height:100%"]{height:auto!important;min-height:100%}
 .cat{flex:none}
 .spread.rev .half:first-child{order:2}
 .txt{padding:3vh 6vw 9vh;gap:1.6vh}
 .h1{font-size:min(9.5vw,5.4vh)}
 .lead{font-size:14px;line-height:1.65}
 .prod{padding:3vh 6vw}
 .hide-sm{display:none!important}
 .cat{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px;padding-bottom:70px}
 .cat .nm{font-size:13px}
 .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){.hint{animation:none}*{transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
<button id="cartBtn" aria-label="Abrir cesta"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M5 8h14l-1 13H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg><span class="badge" id="badge" hidden>0</span></button>
</div>

<main id="v-revista" class="view">
<div id="mag"><div class="stage" id="stage"></div></div>
<button class="nav-arrow" id="prevBtn" style="left:16px" aria-label="Página anterior">‹</button><button class="nav-arrow" id="nextBtn" style="right:16px" aria-label="Página siguiente">›</button>
<nav class="dots" aria-label="Páginas"><span class="serif" id="pgLabel" style="font-size:11px;letter-spacing:.1em">01 / 12</span><div id="dots" style="display:flex;gap:3px"></div></nav>
</main>

<div id="v-ficha" class="view page" hidden></div>
<div id="v-encargo" class="view enc" hidden></div>

<div class="overlay" id="quick" hidden></div>
<div class="drawer" id="drawer" hidden>
<button class="bg" aria-label="Cerrar cesta" data-close-cart></button>
<aside aria-label="Tu cesta">
<div style="padding:24px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #D9CFC3"><span class="serif" style="font-size:28px">Tu cesta</span><button class="x" style="position:static" aria-label="Cerrar" data-close-cart>×</button></div>
<div id="cartList" style="flex:1;overflow:auto;padding:20px 28px;display:flex;flex-direction:column;gap:18px"></div>
<div style="padding:22px 28px;border-top:1px solid #D9CFC3;display:flex;flex-direction:column;gap:10px"><span style="font-size:13px;color:var(--muted)">Envío en caja de regalo incluido</span><a class="btn ink" id="checkout" href="#encargo">Finalizar pedido</a></div>
</aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
{

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const WHATSAPP = '[NUMERO]';

 trenza: { name: 'Trenza', sub: 'Verde petróleo', img: 'img/trenza.webp', gallery: ['img/trenza.webp', 'img/portada.jpg', 'img/trenza-1.jpg', 'img/trenza-2.jpg'], tag: 'Herrajes plateados · Flecos', mat: 'Hilo textil verde petróleo, punto espiga', metal: 'Mosquetones y cadena plateados', wear: 'En la mano o cruzado', story: 'Columnas de punto espiga que dibujan relieve con la luz. Asa acolchada, bandolera trenzada y flecos largos que acompañan cada paso.' },
 cacao: { name: 'Bicolor', sub: 'Cacao & Crema', img: 'img/cacao.webp', tag: 'Cadena dorada', mat: 'Hilo textil bicolor', metal: 'Cadena dorada', wear: 'Al hombro o en la mano', story: 'Dos tonos que se cruzan en cada punto: el chocolate profundo y el crema luminoso. Su cadena dorada lo lleva del día a la noche sin esfuerzo.' },

 flecos: { name: 'Flecos', sub: 'Blanco', img: 'img/flecos.webp', tag: 'Flecos con cuentas doradas', mat: 'Hilo textil blanco', metal: 'Cadena y cuentas doradas', wear: 'Al hombro', story: 'Blanco luminoso con flecos rematados en cuentas doradas. Perfecto para el verano y las celebraciones.' },

const N = PAGES.length;

$('#dots').innerHTML = PAGES.map((p, i) => `<button aria-label="Ir a ${p.name}" data-go="${i}"></button>`).join('');
const els = [...stage.children], dotEls = [...$('#dots').children];
let cur = 0, busy = 0;
function frame() {
 els.forEach((el, i) => { el.classList.toggle('turned', i < cur); el.setAttribute('aria-hidden', i !== cur); el.inert = i !== cur; });
 $('#pgLabel').textContent = String(cur + 1).padStart(2, '0') + ' / ' + N;
 dotEls.forEach((d, i) => d.classList.toggle('on', i === cur));
 $('#prevBtn').disabled = cur === 0; $('#nextBtn').disabled = cur === N - 1;
}
function goPage(i) {
 i = Math.max(0, Math.min(N - 1, i)); if (i === cur) return;
 const turning = i > cur ? els[cur] : els[i];
 turning.classList.add('turning'); setTimeout(() => turning.classList.remove('turning'), 950);
 cur = i; els[cur].scrollTop = 0; frame();
}
const step = (d) => { const now = Date.now(); if (now - busy < 650) return; busy = now; goPage(cur + d); };
$('#prevBtn').addEventListener('click', () => goPage(cur - 1));
$('#nextBtn').addEventListener('click', () => goPage(cur + 1));
let tx = 0, ty = 0, tt0 = 0;
stage.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt0 = Date.now(); }, { passive: true });
stage.addEventListener('touchend', (e) => { const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) step(dx < 0 ? 1 : -1); }, { passive: true });
stage.addEventListener('wheel', (e) => { if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) > 25) { e.preventDefault(); step(e.deltaX > 0 ? 1 : -1); } }, { passive: false });
document.addEventListener('keydown', (e) => { if ($('#v-revista').hidden || !$('#quick').hidden || !$('#drawer').hidden || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return; if (e.key === 'ArrowRight') goPage(cur + 1); if (e.key === 'ArrowLeft') goPage(cur - 1); });

 if (t.dataset.set) { cfg[t.dataset.set] = +t.dataset.v; renderEncargo(); }
 else if (t.dataset.extra) { cfg.extras[t.dataset.extra] = !cfg.extras[t.dataset.extra]; renderEncargo(); }
 else if (t.dataset.step) { cfg.step = Math.max(0, Math.min(3, +t.dataset.step)); renderEncargo(); scrollTo({ top: 0 }); }
 else if (t.dataset.copy !== undefined) { const txt = $('#v-encargo pre').textContent; try { navigator.clipboard.writeText(txt).then(() => toast('Resumen copiado'), () => toast('Selecciona el texto para copiarlo')); } catch (er) { toast('Selecciona el texto para copiarlo'); } }
});
$('#v-encargo').addEventListener('input', (e) => {
 const id = e.target.id;
 if (id === 'fIni') { cfg.initials = e.target.value.toUpperCase().slice(0, 3); const pos = e.target.selectionStart; renderEncargo(); const n = $('#fIni'); n.focus(); n.setSelectionRange(pos, pos); }
 else if (id === 'fName') cfg.name = e.target.value; else if (id === 'fContact') cfg.contact = e.target.value; else if (id === 'fNotes') cfg.notes = e.target.value;
});

/* ---------- eventos globales ---------- */
document.addEventListener('click', (e) => {
 const t = e.target.closest('[data-cfg],[data-add],[data-fav],[data-quick],[data-go],[data-closeq],[data-close-cart],[data-rm],[data-why],[data-mg-color],[data-mg-metal],[data-mg-handle],[data-mg-c2]');
 if (!t) return;
 if (t.dataset.cfg) { const k = t.dataset.cfg; if (k === 'extra') cfg.extras[t.dataset.v] = !cfg.extras[t.dataset.v]; else cfg[k] = +t.dataset.v; if (!$('#v-encargo').hidden) renderEncargo(); else mgUpdate(); return; }
 if (t.dataset.add) add(t.dataset.add);
 if (t.dataset.fav) fav(t.dataset.fav);
 if (t.dataset.quick) quick(t.dataset.quick);
 if (t.dataset.go) { e.preventDefault(); if (location.hash && location.hash !== '#revista') { location.hash = 'revista'; setTimeout(() => goPage(+t.dataset.go), 60); } else goPage(+t.dataset.go); }
 if (t.dataset.closeq !== undefined) $('#quick').hidden = true;
 if (t.dataset.closeCart !== undefined) $('#drawer').hidden = true;
 if (t.dataset.rm) { cart.splice(+t.dataset.rm, 1); store.set('cart', cart); renderCart(); }
 if (t.dataset.why) { const i = +t.dataset.why; $('#whyText').textContent = WHY[i][2]; document.querySelectorAll('[data-why]').forEach((b, j) => { b.setAttribute('aria-selected', j === i); b.style.borderTopColor = j === i ? 'var(--gold)' : 'transparent'; }); }
 if (t.dataset.mgColor) { cfg.color = +t.dataset.mgColor; mgUpdate(); }
 if (t.dataset.mgMetal) { cfg.metal = +t.dataset.mgMetal; mgUpdate(); }
 if (t.dataset.mgHandle) { cfg.handle = +t.dataset.mgHandle; mgUpdate(); }
 if (t.dataset.mgC2) { cfg.color2 = +t.dataset.mgC2; mgUpdate(); }
});
$('#quick').addEventListener('click', (e) => { if (e.target.id === 'quick') $('#quick').hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('#quick').hidden = true; $('#drawer').hidden = true; } });
$('#cartBtn').addEventListener('click', () => { $('#drawer').hidden = false; });
$('#checkout').addEventListener('click', () => { $('#drawer').hidden = true; cfg.step = 3; });
$('#nl').addEventListener('submit', (e) => { e.preventDefault(); e.target.outerHTML = '<p class="serif gold" style="margin:0;font-size:24px;font-style:italic">Bienvenida al círculo. Pronto tendrás noticias nuestras.</p>'; });

/* ---------- rutas ---------- */
let magScroll = 0;
function route() {
 const h = location.hash.slice(1);
 const isF = h.startsWith('ficha-') && P[h.slice(6)], isE = h === 'encargo';
 if (!$('#v-revista').hidden && (isF || isE)) magScroll = scrollY;
 $('#v-revista').hidden = !!(isF || isE); document.body.classList.toggle('mag-on', !(isF || isE)); $('#v-ficha').hidden = !isF; $('#v-encargo').hidden = !isE;
 $('#quick').hidden = true;
 if (isF) { renderFicha(h.slice(6)); scrollTo({ top: 0 }); document.title = `${P[h.slice(6)].name} ${P[h.slice(6)].sub} — ElunayBags`; }
 else if (isE) { renderEncargo(); scrollTo({ top: 0 }); document.title = 'Encargo a tu gusto — ElunayBags'; }
 else { document.title = 'ElunayBags — Revista'; frame(); }
}
addEventListener('hashchange', route);
renderCart(); route(); frame();

if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(() => {}); }
}
</script>
</body>
